name: Gerar APK Android Final

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-certified-switch-android
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Crypto Certified Switch
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive

      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
      APP_ANDROID_SKIP_UPDATE: "False"

      P4A_RECOMMENDED_NDK: "28c"
      ANDROID_API: "35"
      ANDROID_MIN_API: "26"

    steps:

      # ============================================================
      # 01 - BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 02 - CONFIGURAR PYTHON FIXO
      # ============================================================

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ============================================================
      # 03 - VERIFICAR RUNNER
      # ============================================================

      - name: Verificar ambiente
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo " CRYPTO CERTIFIED SWITCH v7.1.0"
          echo " ANDROID BUILD - GITHUB ACTIONS"
          echo "================================================"

          echo
          echo "Diretorio:"
          pwd

          echo
          echo "Sistema:"
          uname -a

          echo
          echo "Arquitetura:"
          uname -m

          echo
          echo "Python:"
          python --version

          echo
          echo "Arquivos:"
          ls -la

      # ============================================================
      # 04 - VALIDAR ESTRUTURA
      # ============================================================

      - name: Validar estrutura do projeto
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "main.py" ]; then
            echo "ERRO: main.py nao encontrado."
            exit 1
          fi

          if [ ! -f "buildozer.spec" ]; then
            echo "ERRO: buildozer.spec nao encontrado."
            exit 1
          fi

          echo "OK: main.py encontrado."
          echo "OK: buildozer.spec encontrado."

      # ============================================================
      # 05 - INSTALAR DEPENDENCIAS OFICIAIS DO P4A
      # ============================================================

      - name: Instalar dependencias Ubuntu
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libtool-bin \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            sudo \
            unzip \
            wget \
            zip \
            zlib1g-dev \
            build-essential \
            gettext

          echo
          echo "================================================"
          echo " VERSOES DO AMBIENTE"
          echo "================================================"

          echo
          echo "Java:"
          java -version

          echo
          echo "Javac:"
          javac -version

          echo
          echo "Autoconf:"
          autoconf --version | head -n 1

          echo
          echo "Automake:"
          automake --version | head -n 1

          echo
          echo "Libtool:"
          libtoolize --version | head -n 1

          echo
          echo "Python:"
          python --version

      # ============================================================
      # 06 - PREPARAR AMBIENTE PYTHON
      # ============================================================

      - name: Preparar Buildozer
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.37"

          echo
          echo "================================================"
          echo " FERRAMENTAS PYTHON"
          echo "================================================"

          python --version
          pip --version
          buildozer --version
          cython --version

      # ============================================================
      # 07 - VALIDAR TODO PYTHON DO PROJETO
      # ============================================================

      - name: Validar sintaxe Python
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          ignorar = {
              ".git",
              ".github",
              ".buildozer",
              ".venv",
              "venv",
              "bin",
              "artifact",
              "__pycache__",
          }

          erros = []

          for arquivo in Path(".").rglob("*.py"):
              if any(parte in ignorar for parte in arquivo.parts):
                  continue

              try:
                  py_compile.compile(
                      str(arquivo),
                      doraise=True,
                  )
                  print("OK:", arquivo)

              except Exception as exc:
                  erros.append((arquivo, exc))

          if erros:
              print()
              print("================================================")
              print(" ERROS PYTHON")
              print("================================================")

              for arquivo, erro in erros:
                  print()
                  print("Arquivo:", arquivo)
                  print("Erro:", erro)

              sys.exit(1)

          print()
          print("OK: todos os arquivos Python compilam.")
          PY

      # ============================================================
      # 08 - PREPARAR BUILDOZER.SPEC PARA CI
      #
      # Mantem configuracoes do projeto e altera somente os campos
      # Android necessarios para tornar o build deterministico.
      # ============================================================

      - name: Preparar buildozer.spec
        shell: bash
        run: |
          set -euo pipefail

          cp buildozer.spec buildozer-original.spec

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")

          texto = path.read_text(
              encoding="utf-8-sig"
          )

          linhas = texto.splitlines()

          valores = {
              "android.api": "35",
              "android.minapi": "26",
              "android.ndk": "28c",
              "android.accept_sdk_license": "True",
              "android.skip_update": "False",
          }

          resultado = []

          dentro_app = False
          encontrados = set()

          for linha in linhas:

              limpa = linha.strip()

              if limpa.startswith("[") and limpa.endswith("]"):

                  if dentro_app:
                      for chave, valor in valores.items():
                          if chave not in encontrados:
                              resultado.append(
                                  f"{chave} = {valor}"
                              )

                  dentro_app = (
                      limpa.lower() == "[app]"
                  )

                  resultado.append(linha)
                  continue

              if dentro_app:

                  sem_comentario = limpa.lstrip("#").strip()

                  substituido = False

                  for chave, valor in valores.items():

                      if re.match(
                          rf"^{re.escape(chave)}\s*=",
                          sem_comentario,
                      ):
                          resultado.append(
                              f"{chave} = {valor}"
                          )

                          encontrados.add(chave)
                          substituido = True
                          break

                  if substituido:
                      continue

              resultado.append(linha)

          if dentro_app:
              for chave, valor in valores.items():
                  if chave not in encontrados:
                      resultado.append(
                          f"{chave} = {valor}"
                      )

          path.write_text(
              "\n".join(resultado) + "\n",
              encoding="utf-8",
          )

          print("OK: buildozer.spec preparado.")
          PY

          echo
          echo "================================================"
          echo " CONFIGURACAO ANDROID EFETIVA"
          echo "================================================"

          grep -nE \
            '^\[app\]|^requirements|^android\.api|^android\.minapi|^android\.ndk|^android\.accept_sdk_license|^android\.skip_update|^android\.archs' \
            buildozer.spec \
            || true

      # ============================================================
      # 09 - VALIDAR CONFIGURACAO
      # ============================================================

      - name: Validar configuracao Android
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            '^android.api = 35' \
            buildozer.spec

          grep -q \
            '^android.minapi = 26' \
            buildozer.spec

          grep -q \
            '^android.ndk = 28c' \
            buildozer.spec

          grep -q \
            '^android.accept_sdk_license = True' \
            buildozer.spec

          grep -q \
            '^android.skip_update = False' \
            buildozer.spec

          echo "OK: Android API 35."
          echo "OK: min API 26."
          echo "OK: NDK r28c."
          echo "OK: licencas automaticas."

      # ============================================================
      # 10 - LIMPAR BUILD ANTERIOR
      # ============================================================

      - name: Limpar ambiente de compilacao
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .buildozer
          rm -rf bin
          rm -rf artifact

          mkdir -p bin
          mkdir -p artifact

          echo "OK: ambiente limpo."

      # ============================================================
      # 11 - CONFIGURAR JAVA
      # ============================================================

      - name: Configurar Java 17
        shell: bash
        run: |
          set -euo pipefail

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "JAVA_HOME=$JAVA_HOME"

          command -v java
          command -v javac
          command -v keytool

          java -version
          javac -version

      # ============================================================
      # 12 - COMPILAR APK
      # ============================================================

      - name: Compilar APK
        id: build_apk
        shell: bash
        run: |
          set +e

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          export APP_ANDROID_ACCEPT_SDK_LICENSE="True"
          export APP_ANDROID_SKIP_UPDATE="False"

          export PYTHONUNBUFFERED=1

          echo "================================================"
          echo " INICIANDO COMPILACAO"
          echo "================================================"

          buildozer -v android debug \
            2>&1 | tee build-apk.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo
          echo "================================================"
          echo " BUILDOZER EXIT CODE: $BUILD_EXIT"
          echo "================================================"

          echo "$BUILD_EXIT" \
            > build-exit-code.txt

          exit "$BUILD_EXIT"

      # ============================================================
      # 13 - DIAGNOSTICO AUTOMATICO
      # ============================================================

      - name: Diagnosticar erro
        if: failure()
        shell: bash
        run: |
          set +e

          echo "================================================"
          echo " DIAGNOSTICO AUTOMATICO"
          echo "================================================"

          if [ ! -f build-apk.log ]; then
            echo "Log build-apk.log nao encontrado."
            exit 0
          fi

          echo
          echo "=== ULTIMAS 350 LINHAS ==="

          tail -n 350 build-apk.log

          echo
          echo "================================================"
          echo " ERROS IMPORTANTES"
          echo "================================================"

          grep -niE \
            'error:|failed|failure|exception|traceback|command failed|autoreconf|autoconf|automake|libtool|no such file|not found|undefined reference|cannot|could not|license|aidl|gradle|clang|cython|configure: error|recipe' \
            build-apk.log \
            | tail -n 250 \
            || true

          echo
          echo "================================================"
          echo " CONTEXTO DE AUTORECONF"
          echo "================================================"

          grep -niB 25 -A 40 \
            'autoreconf' \
            build-apk.log \
            | tail -n 300 \
            || true

          echo
          echo "================================================"
          echo " CONTEXTO DE CONFIGURE ERROR"
          echo "================================================"

          grep -niB 30 -A 50 \
            'configure: error' \
            build-apk.log \
            | tail -n 300 \
            || true

      # ============================================================
      # 14 - MOSTRAR SDK / NDK UTILIZADOS
      # ============================================================

      - name: Mostrar SDK e NDK
        if: always()
        shell: bash
        run: |
          echo "================================================"
          echo " ANDROID SDK / NDK"
          echo "================================================"

          find "$HOME/.buildozer" \
            -maxdepth 5 \
            -type d \
            \( \
              -name "android-sdk" \
              -o \
              -name "android-ndk*" \
              -o \
              -name "build-tools" \
            \) \
            -print \
            2>/dev/null \
            || true

          echo
          echo "NDKs encontrados:"

          find "$HOME/.buildozer" \
            -type d \
            -name 'android-ndk-r*' \
            -print \
            2>/dev/null \
            || true

      # ============================================================
      # 15 - MOSTRAR ARQUIVOS GERADOS
      # ============================================================

      - name: Mostrar arquivos gerados
        if: always()
        shell: bash
        run: |
          echo "================================================"
          echo " ARQUIVOS GERADOS"
          echo "================================================"

          echo
          echo "=== BIN ==="

          find bin \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo
          echo "=== APK / AAB ==="

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print \
            2>/dev/null \
            || true

      # ============================================================
      # 16 - PREPARAR APK FINAL
      # ============================================================

      - name: Preparar APK final
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            echo "ERRO: nenhum APK encontrado em bin/."

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp \
            "$APK" \
            artifact/Crypto-Certified-Switch-v7.1.0.apk

          sha256sum \
            artifact/Crypto-Certified-Switch-v7.1.0.apk \
            > artifact/SHA256.txt

          echo
          echo "================================================"
          echo " APK FINAL"
          echo "================================================"

          ls -lh \
            artifact/Crypto-Certified-Switch-v7.1.0.apk

          echo
          cat artifact/SHA256.txt

      # ============================================================
      # 17 - SALVAR APK
      # ============================================================

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-APK
          path: |
            artifact/Crypto-Certified-Switch-v7.1.0.apk
            artifact/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 18 - SALVAR LOG SE FALHAR
      # ============================================================

      - name: Salvar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-Build-Log
          path: |
            build-apk.log
            build-exit-code.txt
            buildozer.spec
            buildozer-original.spec
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 19 - CONCLUSAO
      # ============================================================

      - name: Build concluido
        if: success()
        shell: bash
        run: |
          echo
          echo "================================================"
          echo " APK GERADO COM SUCESSO"
          echo "================================================"
          echo
          echo "Arquivo:"
          echo "Crypto-Certified-Switch-v7.1.0.apk"
