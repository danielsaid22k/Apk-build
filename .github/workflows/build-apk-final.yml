name: Gerar APK Android Final

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-certified-switch-android
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Crypto Certified Switch
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      # Overrides oficiais do [app] do Buildozer.
      APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
      APP_ANDROID_SKIP_UPDATE: "False"

    steps:

      # ============================================================
      # 01 - BAIXAR O PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 02 - VERIFICAR RUNNER
      # ============================================================

      - name: Verificar ambiente
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo " CRYPTO CERTIFIED SWITCH v7.1.0"
          echo " BUILD ANDROID - GITHUB ACTIONS"
          echo "=============================================="

          echo
          echo "Diretorio:"
          pwd

          echo
          echo "Sistema:"
          uname -a

          echo
          echo "Arquitetura:"
          uname -m

          echo
          echo "Arquivos da raiz:"
          ls -la

      # ============================================================
      # 03 - VALIDAR ESTRUTURA
      # ============================================================

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -e

          if [ ! -f "main.py" ]; then
            echo "ERRO: main.py nao encontrado na raiz."
            exit 1
          fi

          if [ ! -f "buildozer.spec" ]; then
            echo "ERRO: buildozer.spec nao encontrado na raiz."
            exit 1
          fi

          echo "OK: main.py"
          echo "OK: buildozer.spec"

      # ============================================================
      # 04 - INSTALAR DEPENDENCIAS LINUX
      # ============================================================

      - name: Instalar dependencias Ubuntu
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            python3 \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext \
            patch \
            build-essential \
            ccache

          echo
          echo "=== JAVA ==="
          java -version
          javac -version

          echo
          echo "=== PYTHON ==="
          python3 --version

          echo
          echo "=== GIT ==="
          git --version

      # ============================================================
      # 05 - CRIAR VENV
      # ============================================================

      - name: Preparar Buildozer
        shell: bash
        run: |
          set -e

          rm -rf .venv

          python3 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython<3"

          echo
          echo "=== FERRAMENTAS ==="

          python --version
          buildozer --version
          cython --version

      # ============================================================
      # 06 - VALIDAR TODO O PYTHON DO PROJETO
      # ============================================================

      - name: Validar sintaxe Python
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          IGNORAR = {
              ".git",
              ".github",
              ".buildozer",
              ".venv",
              "venv",
              "bin",
              "artifact",
              "__pycache__",
          }

          erros = []

          for arquivo in Path(".").rglob("*.py"):
              if any(parte in IGNORAR for parte in arquivo.parts):
                  continue

              try:
                  py_compile.compile(
                      str(arquivo),
                      doraise=True,
                  )
                  print("OK:", arquivo)

              except Exception as exc:
                  erros.append((arquivo, exc))

          if erros:
              print()
              print("==============================================")
              print(" ERROS PYTHON ENCONTRADOS")
              print("==============================================")

              for arquivo, erro in erros:
                  print()
                  print("Arquivo:", arquivo)
                  print("Erro:", erro)

              sys.exit(1)

          print()
          print("OK: sintaxe Python validada.")
          PY

      # ============================================================
      # 07 - PREPARAR BUILDOZER.SPEC EXCLUSIVO DO CI
      #
      # Fazemos a alteracao DENTRO da secao [app].
      # Nao adicionamos linhas soltas no final do arquivo.
      # ============================================================

      - name: Preparar configuracao Android CI
        shell: bash
        run: |
          set -e

          cp buildozer.spec buildozer-original.spec

          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")

          texto = p.read_text(
              encoding="utf-8-sig"
          )

          linhas = texto.splitlines()

          resultado = []

          dentro_app = False

          encontrou_accept = False
          encontrou_skip = False

          for linha in linhas:

              limpa = linha.strip()

              if limpa.startswith("[") and limpa.endswith("]"):

                  # Antes de sair de [app], inserir as configuracoes
                  # que ainda nao existirem.
                  if dentro_app:

                      if not encontrou_accept:
                          resultado.append(
                              "android.accept_sdk_license = True"
                          )

                      if not encontrou_skip:
                          resultado.append(
                              "android.skip_update = False"
                          )

                  dentro_app = limpa.lower() == "[app]"

                  resultado.append(linha)

                  continue

              if dentro_app:

                  chave = limpa.lstrip("#").strip()

                  if chave.startswith(
                      "android.accept_sdk_license"
                  ):
                      resultado.append(
                          "android.accept_sdk_license = True"
                      )
                      encontrou_accept = True
                      continue

                  if chave.startswith(
                      "android.skip_update"
                  ):
                      resultado.append(
                          "android.skip_update = False"
                      )
                      encontrou_skip = True
                      continue

              resultado.append(linha)

          # Caso [app] seja a ultima secao do arquivo.
          if dentro_app:

              if not encontrou_accept:
                  resultado.append(
                      "android.accept_sdk_license = True"
                  )

              if not encontrou_skip:
                  resultado.append(
                      "android.skip_update = False"
                  )

          p.write_text(
              "\n".join(resultado) + "\n",
              encoding="utf-8",
          )

          print("OK: buildozer.spec preparado para CI.")
          PY

          echo
          echo "=============================================="
          echo " CONFIGURACAO ANDROID EFETIVA"
          echo "=============================================="

          grep -nE \
            '^\[app\]|android\.api|android\.minapi|android\.ndk|android\.accept_sdk_license|android\.skip_update|requirements' \
            buildozer.spec || true

      # ============================================================
      # 08 - CONFIRMAR VARIAVEIS DE AUTOMACAO
      # ============================================================

      - name: Verificar configuracao de licencas
        shell: bash
        run: |
          set -e

          echo "APP_ANDROID_ACCEPT_SDK_LICENSE=$APP_ANDROID_ACCEPT_SDK_LICENSE"
          echo "APP_ANDROID_SKIP_UPDATE=$APP_ANDROID_SKIP_UPDATE"

          if ! grep -q \
            '^android.accept_sdk_license = True' \
            buildozer.spec
          then
            echo "ERRO: aceitacao automatica da licenca nao configurada."
            exit 1
          fi

          echo "OK: licencas configuradas para automacao."

      # ============================================================
      # 09 - CRIAR DIRETORIOS
      # ============================================================

      - name: Preparar diretorios
        shell: bash
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin
          rm -rf artifact

          mkdir -p bin
          mkdir -p artifact

      # ============================================================
      # 10 - COMPILAR
      #
      # IMPORTANTE:
      # Sem "yes | buildozer".
      # O proprio Buildozer aceita as licencas.
      #
      # Tambem preservamos o codigo real de retorno do Buildozer.
      # ============================================================

      - name: Compilar APK
        id: build_apk
        shell: bash
        run: |
          set +e

          source .venv/bin/activate

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          export APP_ANDROID_ACCEPT_SDK_LICENSE="True"
          export APP_ANDROID_SKIP_UPDATE="False"

          echo "=============================================="
          echo " INICIANDO COMPILACAO"
          echo "=============================================="

          buildozer -v android debug \
            > >(tee build-apk.log) \
            2>&1

          BUILD_EXIT=$?

          echo
          echo "=============================================="
          echo " BUILDOZER EXIT CODE: $BUILD_EXIT"
          echo "=============================================="

          echo "$BUILD_EXIT" > build-exit-code.txt

          exit "$BUILD_EXIT"

      # ============================================================
      # 11 - DIAGNOSTICO AUTOMATICO
      #
      # Se falhar, mostra as linhas mais uteis do erro verdadeiro.
      # ============================================================

      - name: Diagnosticar erro
        if: failure()
        shell: bash
        run: |
          echo "=============================================="
          echo " DIAGNOSTICO AUTOMATICO"
          echo "=============================================="

          if [ ! -f build-apk.log ]; then
            echo "Log de compilacao nao encontrado."
            exit 0
          fi

          echo
          echo "=== ULTIMAS 250 LINHAS ==="
          tail -n 250 build-apk.log || true

          echo
          echo "=== ERROS IMPORTANTES ==="

          grep -niE \
            'error:|failed|failure|exception|traceback|command failed|no such file|not found|undefined reference|cannot|could not|license|aidl|gradle|clang|cython' \
            build-apk.log \
            | tail -n 150 \
            || true

      # ============================================================
      # 12 - LOCALIZAR RESULTADOS
      # ============================================================

      - name: Mostrar arquivos gerados
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo " ARQUIVOS GERADOS"
          echo "=============================================="

          echo
          echo "=== BIN ==="

          find bin \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo
          echo "=== TODOS APK / AAB ==="

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print \
            2>/dev/null \
            || true

      # ============================================================
      # 13 - PREPARAR APK FINAL
      # ============================================================

      - name: Preparar APK final
        if: success()
        shell: bash
        run: |
          set -e

          APK="$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            echo "ERRO: nenhum APK encontrado em bin/."

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp \
            "$APK" \
            artifact/Crypto-Certified-Switch-v7.1.0.apk

          sha256sum \
            artifact/Crypto-Certified-Switch-v7.1.0.apk \
            > artifact/SHA256.txt

          echo
          echo "=== APK FINAL ==="

          ls -lh \
            artifact/Crypto-Certified-Switch-v7.1.0.apk

          cat artifact/SHA256.txt

      # ============================================================
      # 14 - SALVAR APK
      # ============================================================

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-APK
          path: |
            artifact/Crypto-Certified-Switch-v7.1.0.apk
            artifact/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 15 - SALVAR LOG COMPLETO EM CASO DE FALHA
      # ============================================================

      - name: Salvar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-Build-Log
          path: |
            build-apk.log
            build-exit-code.txt
            buildozer.spec
            buildozer-original.spec
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 16 - CONCLUSAO
      # ============================================================

      - name: Build concluido
        if: success()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " APK GERADO COM SUCESSO"
          echo "=============================================="
          echo
          echo "Arquivo:"
          echo "Crypto-Certified-Switch-v7.1.0.apk"
          echo
