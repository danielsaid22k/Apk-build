name: Gerar APK Android Final

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-certified-switch-android
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Crypto Certified Switch
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive

      APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
      APP_ANDROID_SKIP_UPDATE: "False"

    steps:

      # ============================================================
      # 01 - BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 02 - VERIFICAR RUNNER
      # ============================================================

      - name: Verificar ambiente
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " CRYPTO CERTIFIED SWITCH v7.1.0"
          echo " BUILD ANDROID - GITHUB ACTIONS"
          echo "=============================================="

          echo
          echo "Diretorio:"
          pwd

          echo
          echo "Sistema:"
          uname -a

          echo
          echo "Arquitetura:"
          uname -m

          echo
          echo "Arquivos:"
          ls -la

      # ============================================================
      # 03 - VALIDAR PROJETO
      # ============================================================

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f main.py ]; then
            echo "ERRO: main.py nao encontrado."
            exit 1
          fi

          if [ ! -f buildozer.spec ]; then
            echo "ERRO: buildozer.spec nao encontrado."
            exit 1
          fi

          echo "OK: main.py"
          echo "OK: buildozer.spec"

      # ============================================================
      # 04 - JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 05 - DEPENDENCIAS UBUNTU
      #
      # libltdl-dev e essencial para os macros libtool utilizados
      # pela compilacao do libffi no python-for-android.
      # ============================================================

      - name: Instalar dependencias Ubuntu
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " INSTALANDO DEPENDENCIAS"
          echo "=============================================="

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            m4 \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            patch \
            build-essential \
            ccache \
            ant

          echo
          echo "=============================================="
          echo " VERSOES"
          echo "=============================================="

          java -version
          javac -version
          python3 --version
          git --version
          autoconf --version
          automake --version
          libtoolize --version
          aclocal --version
          m4 --version
          cmake --version

          echo
          echo "=============================================="
          echo " VERIFICANDO MACRO LT_SYS_SYMBOL_USCORE"
          echo "=============================================="

          MACRO_RESULT="$(
            grep -R \
              "LT_SYS_SYMBOL_USCORE" \
              /usr/share/aclocal \
              /usr/share/libtool \
              2>/dev/null \
              | head -n 20 \
              || true
          )"

          if [ -n "$MACRO_RESULT" ]; then
            echo "$MACRO_RESULT"
            echo
            echo "OK: macro LT_SYS_SYMBOL_USCORE encontrada."
          else
            echo
            echo "AVISO: macro LT_SYS_SYMBOL_USCORE nao localizada diretamente."
            echo "Continuaremos porque libtool/libltdl estao instalados."
          fi

      # ============================================================
      # 06 - VENV + BUILDOZER
      # ============================================================

      - name: Preparar Buildozer
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .venv

          python3 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.34"

          echo
          echo "=============================================="
          echo " BUILDOZER"
          echo "=============================================="

          python --version
          buildozer --version
          cython --version

      # ============================================================
      # 07 - VALIDAR PYTHON
      # ============================================================

      - name: Validar sintaxe Python
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          IGNORAR = {
              ".git",
              ".github",
              ".buildozer",
              ".venv",
              "venv",
              "bin",
              "artifact",
              "__pycache__",
          }

          erros = []

          for arquivo in Path(".").rglob("*.py"):

              if any(parte in IGNORAR for parte in arquivo.parts):
                  continue

              try:
                  py_compile.compile(
                      str(arquivo),
                      doraise=True,
                  )

                  print("OK:", arquivo)

              except Exception as exc:
                  erros.append((arquivo, exc))

          if erros:

              print()
              print("==============================================")
              print(" ERROS PYTHON")
              print("==============================================")

              for arquivo, erro in erros:
                  print()
                  print("Arquivo:", arquivo)
                  print("Erro:", erro)

              sys.exit(1)

          print()
          print("OK: sintaxe Python validada.")
          PY

      # ============================================================
      # 08 - PREPARAR BUILDOZER.SPEC
      # ============================================================

      - name: Preparar buildozer.spec
        shell: bash
        run: |
          set -euo pipefail

          cp buildozer.spec buildozer-original.spec

          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")

          texto = p.read_text(
              encoding="utf-8-sig"
          )

          linhas = texto.splitlines()

          resultado = []

          dentro_app = False

          valores = {
              "android.accept_sdk_license":
                  "android.accept_sdk_license = True",

              "android.skip_update":
                  "android.skip_update = False",
          }

          encontrados = {
              chave: False
              for chave in valores
          }

          for linha in linhas:

              limpa = linha.strip()

              if limpa.startswith("[") and limpa.endswith("]"):

                  if dentro_app:

                      for chave, valor in valores.items():

                          if not encontrados[chave]:
                              resultado.append(valor)

                  dentro_app = limpa.lower() == "[app]"

                  resultado.append(linha)

                  continue

              if dentro_app:

                  chave_linha = (
                      limpa
                      .lstrip("#")
                      .strip()
                  )

                  alterou = False

                  for chave, valor in valores.items():

                      if chave_linha.startswith(chave):

                          resultado.append(valor)

                          encontrados[chave] = True

                          alterou = True

                          break

                  if alterou:
                      continue

              resultado.append(linha)

          if dentro_app:

              for chave, valor in valores.items():

                  if not encontrados[chave]:
                      resultado.append(valor)

          p.write_text(
              "\n".join(resultado) + "\n",
              encoding="utf-8",
          )

          print("OK: buildozer.spec preparado.")
          PY

          echo
          echo "=============================================="
          echo " BUILDOZER.SPEC EFETIVO"
          echo "=============================================="

          grep -nE \
            '^\[app\]|requirements|android\.api|android\.minapi|android\.ndk|android\.arch|android\.archs|android\.accept_sdk_license|android\.skip_update|p4a\.' \
            buildozer.spec \
            || true

      # ============================================================
      # 09 - VALIDAR CONFIG
      # ============================================================

      - name: Validar configuracao Android
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q \
            '^android.accept_sdk_license = True' \
            buildozer.spec
          then
            echo "ERRO: android.accept_sdk_license."
            exit 1
          fi

          if ! grep -q \
            '^android.skip_update = False' \
            buildozer.spec
          then
            echo "ERRO: android.skip_update."
            exit 1
          fi

          echo "OK: configuracao Android."

      # ============================================================
      # 10 - LIMPAR BUILD
      # ============================================================

      - name: Limpar ambiente de compilacao
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .buildozer
          rm -rf bin
          rm -rf artifact

          mkdir -p bin
          mkdir -p artifact

          echo "OK: build anterior removido."

      # ============================================================
      # 11 - JAVA EFETIVO
      # ============================================================

      - name: Verificar Java 17
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          command -v java
          command -v javac
          command -v keytool

          java -version
          javac -version

      # ============================================================
      # 12 - VERIFICAR AUTOTOOLS ANTES DO BUILD
      # ============================================================

      - name: Verificar autotools
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " AUTOTOOLS"
          echo "=============================================="

          command -v autoreconf
          command -v autoconf
          command -v automake
          command -v aclocal
          command -v libtoolize
          command -v m4

          echo
          echo "ACLOCAL_PATH antes:"
          echo "${ACLOCAL_PATH:-<vazio>}"

          export ACLOCAL_PATH="/usr/share/aclocal:/usr/local/share/aclocal"

          echo
          echo "ACLOCAL_PATH depois:"
          echo "$ACLOCAL_PATH"

          echo
          echo "Arquivos libtool m4:"
          find /usr/share/aclocal \
            -maxdepth 1 \
            -type f \
            -name 'lt*.m4' \
            -print \
            | sort \
            || true

      # ============================================================
      # 13 - COMPILAR APK
      # ============================================================

      - name: Compilar APK
        id: build_apk
        shell: bash
        run: |
          set +e

          source .venv/bin/activate

          export APP_ANDROID_ACCEPT_SDK_LICENSE="True"
          export APP_ANDROID_SKIP_UPDATE="False"

          export ACLOCAL_PATH="/usr/share/aclocal:/usr/local/share/aclocal"

          export JAVA_HOME="${JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "=============================================="
          echo " INICIANDO COMPILACAO"
          echo "=============================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Autoconf:"
          autoconf --version

          echo
          echo "Libtool:"
          libtoolize --version

          echo
          echo "ACLOCAL_PATH:"
          echo "$ACLOCAL_PATH"

          echo
          echo "=============================================="
          echo " BUILDOZER ANDROID DEBUG"
          echo "=============================================="

          buildozer -v android debug \
            > >(tee build-apk.log) \
            2>&1

          BUILD_EXIT=$?

          echo
          echo "=============================================="
          echo " BUILDOZER EXIT CODE: $BUILD_EXIT"
          echo "=============================================="

          echo "$BUILD_EXIT" \
            > build-exit-code.txt

          exit "$BUILD_EXIT"

      # ============================================================
      # 14 - DIAGNOSTICO
      # ============================================================

      - name: Diagnosticar erro
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " DIAGNOSTICO AUTOMATICO"
          echo "=============================================="

          if [ ! -f build-apk.log ]; then

            echo "build-apk.log nao encontrado."

            exit 0
          fi

          echo
          echo "=== ULTIMAS 400 LINHAS ==="

          tail -n 400 \
            build-apk.log \
            || true

          echo
          echo "=== ERROS IMPORTANTES ==="

          grep -niE \
            'error:|failed|failure|exception|traceback|command failed|no such file|not found|undefined|cannot|could not|license|aidl|gradle|clang|cython|autoconf|autoreconf|automake|libtool|LT_SYS_SYMBOL_USCORE|sdkmanager|ndk|sdk|libffi' \
            build-apk.log \
            | tail -n 250 \
            || true

          echo
          echo "=== CONTEXTO LIBFFI ==="

          grep -ni \
            -C 15 \
            'LT_SYS_SYMBOL_USCORE\|libffi\|autoreconf' \
            build-apk.log \
            | tail -n 250 \
            || true

      # ============================================================
      # 15 - MOSTRAR SDK / NDK
      # ============================================================

      - name: Mostrar SDK e NDK
        if: always()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " SDK / NDK"
          echo "=============================================="

          find "$HOME/.buildozer/android" \
            -maxdepth 4 \
            -type d \
            2>/dev/null \
            | sort \
            | tail -n 200 \
            || true

      # ============================================================
      # 16 - MOSTRAR ARQUIVOS
      # ============================================================

      - name: Mostrar arquivos gerados
        if: always()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " ARQUIVOS GERADOS"
          echo "=============================================="

          echo
          echo "=== BIN ==="

          find bin \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo
          echo "=== APK / AAB ==="

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print \
            2>/dev/null \
            || true

      # ============================================================
      # 17 - PREPARAR APK FINAL
      # ============================================================

      - name: Preparar APK final
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then

            echo "ERRO: nenhum APK encontrado."

            exit 1
          fi

          echo
          echo "APK:"
          echo "$APK"

          cp \
            "$APK" \
            artifact/Crypto-Certified-Switch-v7.1.0.apk

          sha256sum \
            artifact/Crypto-Certified-Switch-v7.1.0.apk \
            > artifact/SHA256.txt

          echo
          echo "=============================================="
          echo " APK FINAL"
          echo "=============================================="

          ls -lh \
            artifact/Crypto-Certified-Switch-v7.1.0.apk

          echo
          cat artifact/SHA256.txt

      # ============================================================
      # 18 - UPLOAD APK
      # ============================================================

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-APK
          path: |
            artifact/Crypto-Certified-Switch-v7.1.0.apk
            artifact/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 19 - UPLOAD LOG
      # ============================================================

      - name: Salvar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-Build-Log
          path: |
            build-apk.log
            build-exit-code.txt
            buildozer.spec
            buildozer-original.spec
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 20 - CONCLUSAO
      # ============================================================

      - name: Build concluido
        if: success()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " APK GERADO COM SUCESSO"
          echo "=============================================="
          echo
          echo "Arquivo:"
          echo "Crypto-Certified-Switch-v7.1.0.apk"
