name: Gerar APK Android Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Crypto Certified Switch
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar arquivos principais
        shell: bash
        run: |
          set -e

          echo "=== RAIZ DO PROJETO ==="
          pwd
          ls -la

          if [ ! -f "buildozer.spec" ]; then
            echo "ERRO: buildozer.spec não encontrado na raiz."
            exit 1
          fi

          if [ ! -f "main.py" ]; then
            echo "ERRO: main.py não encontrado na raiz."
            exit 1
          fi

          echo "OK: arquivos principais encontrados."

      - name: Validar sintaxe Python do projeto
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          ignored = {
              ".git",
              ".buildozer",
              "bin",
              "__pycache__",
              ".venv",
              "venv",
          }

          errors = []

          for path in Path(".").rglob("*.py"):
              if any(part in ignored for part in path.parts):
                  continue

              try:
                  py_compile.compile(
                      str(path),
                      doraise=True,
                  )
                  print("OK:", path)
              except Exception as exc:
                  errors.append((path, exc))

          if errors:
              print("\n=== ERROS PYTHON ===")
              for path, exc in errors:
                  print(path)
                  print(exc)
              sys.exit(1)

          print("\nTodos os arquivos Python passaram na validação.")
          PY

      - name: Instalar dependencias Ubuntu
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3 \
            python3-pip \
            python3-venv \
            python3-virtualenv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext \
            libltdl-dev \
            patch \
            build-essential

          java -version
          javac -version
          python3 --version

      - name: Criar ambiente Python
        shell: bash
        run: |
          set -e

          python3 -m venv .venv
          source .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "cython<3"

          echo "=== BUILD ENV ==="
          python --version
          buildozer --version

      - name: Mostrar buildozer.spec
        shell: bash
        run: |
          set -e

          echo "=== BUILDOZER SPEC ==="
          cat buildozer.spec

      - name: Limpar somente residuos locais
        shell: bash
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail

          source .venv/bin/activate

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "=== INICIANDO BUILD ==="

          buildozer -v android debug 2>&1 | tee build-apk.log

      - name: Mostrar arquivos gerados
        if: always()
        shell: bash
        run: |
          echo "=== BIN ==="
          find bin -maxdepth 2 -type f -print 2>/dev/null || true

          echo
          echo "=== APKs ==="
          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print 2>/dev/null || true

      - name: Preparar APK final
        if: success()
        shell: bash
        run: |
          set -e

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK encontrado em bin/."
            exit 1
          fi

          mkdir -p artifact

          cp "$APK" \
            "artifact/Crypto-Certified-Switch-v7.1.0.apk"

          echo "APK final:"
          ls -lh artifact/

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-APK
          path: artifact/Crypto-Certified-Switch-v7.1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Salvar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-Build-Log
          path: build-apk.log
          if-no-files-found: warn
          retention-days: 7
