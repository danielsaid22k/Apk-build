name: Gerar APK Android Final

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-certified-switch-android
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Crypto Certified Switch
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive
      APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
      APP_ANDROID_SKIP_UPDATE: "False"

    steps:

      # ============================================================
      # 01 - BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 02 - VERIFICAR ESTRUTURA
      # ============================================================

      - name: Verificar estrutura
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " CRYPTO CERTIFIED SWITCH v7.1.0"
          echo "=============================================="

          pwd
          uname -a
          uname -m

          echo
          ls -la

          test -f main.py || {
            echo "ERRO: main.py nao encontrado."
            exit 1
          }

          test -f buildozer.spec || {
            echo "ERRO: buildozer.spec nao encontrado."
            exit 1
          }

          echo
          echo "OK: estrutura principal encontrada."

      # ============================================================
      # 03 - JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 04 - INSTALAR DEPENDENCIAS DO SISTEMA
      # ============================================================

      - name: Instalar dependencias Ubuntu
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            software-properties-common \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            patch \
            build-essential \
            ccache \
            ant \
            rustc \
            cargo

          echo
          echo "=============================================="
          echo " JAVA"
          echo "=============================================="

          java -version
          javac -version

          echo
          echo "=============================================="
          echo " AUTOCONF / AUTOMAKE / LIBTOOL"
          echo "=============================================="

          autoconf --version
          automake --version
          libtoolize --version

          echo
          echo "=============================================="
          echo " LIBLTDL"
          echo "=============================================="

          dpkg -s libltdl-dev | grep -E 'Status|Version'

          echo
          echo "Arquivos m4 do libtool:"
          dpkg -L libtool | grep '/aclocal/' || true
          dpkg -L libltdl-dev | grep -E '\.m4$' || true

          echo
          echo "=============================================="
          echo " CMAKE / RUST"
          echo "=============================================="

          cmake --version
          rustc --version
          cargo --version

          echo
          echo "OK: dependencias instaladas."

      # ============================================================
      # 05 - INSTALAR PYTHON 3.14
      # ============================================================

      - name: Instalar Python 3.14
        shell: bash
        run: |
          set -euo pipefail

          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update

          sudo apt-get install -y \
            python3.14 \
            python3.14-venv \
            python3.14-dev

          python3.14 --version

      # ============================================================
      # 06 - PREPARAR BUILDOZER
      # ============================================================

      - name: Preparar Buildozer
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .venv

          python3.14 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            legacy-cgi \
            "cython==0.29.34"

          python -m pip install \
            git+https://github.com/kivy/buildozer

          echo
          echo "=== PYTHON ==="
          python --version

          echo
          echo "=== BUILDOZER ==="
          buildozer --version

          echo
          echo "=== CYTHON ==="
          cython --version

      # ============================================================
      # 07 - VALIDAR PYTHON DO PROJETO
      # ============================================================

      - name: Validar sintaxe Python
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          IGNORAR = {
              ".git",
              ".github",
              ".buildozer",
              ".venv",
              "venv",
              "bin",
              "artifact",
              "__pycache__",
          }

          erros = []

          for arquivo in Path(".").rglob("*.py"):
              if any(parte in IGNORAR for parte in arquivo.parts):
                  continue

              try:
                  py_compile.compile(
                      str(arquivo),
                      doraise=True,
                  )
                  print("OK:", arquivo)

              except Exception as exc:
                  erros.append((arquivo, exc))

          if erros:
              print()
              print("==============================================")
              print(" ERROS PYTHON")
              print("==============================================")

              for arquivo, erro in erros:
                  print()
                  print("Arquivo:", arquivo)
                  print("Erro:", erro)

              sys.exit(1)

          print()
          print("OK: sintaxe Python validada.")
          PY

      # ============================================================
      # 08 - VALIDAR BUILDOZER.SPEC
      # ============================================================

      - name: Validar buildozer.spec
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " BUILDOZER.SPEC"
          echo "=============================================="

          cat buildozer.spec

          echo
          echo "=============================================="
          echo " VALIDACOES"
          echo "=============================================="

          grep -q '^android.api = 35' buildozer.spec || {
            echo "ERRO: android.api diferente de 35."
            exit 1
          }

          grep -q '^android.minapi = 26' buildozer.spec || {
            echo "ERRO: android.minapi diferente de 26."
            exit 1
          }

          grep -q '^android.ndk = 29' buildozer.spec || {
            echo "ERRO: android.ndk diferente de 29."
            exit 1
          }

          grep -q '^p4a.branch = develop' buildozer.spec || {
            echo "ERRO: p4a.branch nao esta em develop."
            exit 1
          }

          grep -q '^android.accept_sdk_license = True' buildozer.spec || {
            echo "ERRO: aceitacao da licenca nao configurada."
            exit 1
          }

          grep -q '^requirements = python3,kivy' buildozer.spec || {
            echo "ERRO: requirements inesperado."
            exit 1
          }

          echo
          echo "OK: buildozer.spec validado."

      # ============================================================
      # 09 - LIMPAR BUILD
      # ============================================================

      - name: Limpar ambiente de compilacao
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .buildozer
          rm -rf bin
          rm -rf artifact

          mkdir -p bin
          mkdir -p artifact

          echo "OK: ambiente limpo."

      # ============================================================
      # 10 - VERIFICAR MACROS LIBTOOL
      #
      # Verificacao direta antes de iniciar uma compilacao longa.
      # ============================================================

      - name: Verificar macros Libtool
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " MACROS LIBTOOL"
          echo "=============================================="

          MACRO_FOUND=0

          for dir in \
            /usr/share/aclocal \
            /usr/local/share/aclocal
          do
            if [ -d "$dir" ]; then
              if grep -R \
                "AC_DEFUN.*LT_SYS_SYMBOL_USCORE" \
                "$dir" \
                >/dev/null 2>&1
              then
                echo "OK: LT_SYS_SYMBOL_USCORE encontrado em $dir"
                MACRO_FOUND=1
              fi
            fi
          done

          if [ "$MACRO_FOUND" -ne 1 ]; then
            echo
            echo "ERRO:"
            echo "Macro LT_SYS_SYMBOL_USCORE nao encontrada."
            echo
            echo "Conteudo de /usr/share/aclocal:"
            ls -la /usr/share/aclocal || true
            exit 1
          fi

      # ============================================================
      # 11 - VERIFICAR TOOLCHAIN
      # ============================================================

      - name: Verificar toolchain final
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          echo "=============================================="
          echo " TOOLCHAIN FINAL"
          echo "=============================================="

          python --version
          buildozer --version
          cython --version

          java -version
          javac -version

          echo
          echo "JAVA_HOME=$JAVA_HOME"

          rustc --version
          cargo --version

      # ============================================================
      # 12 - COMPILAR APK
      # ============================================================

      - name: Compilar APK
        id: build_apk
        shell: bash
        run: |
          set +e

          source .venv/bin/activate

          export APP_ANDROID_ACCEPT_SDK_LICENSE="True"
          export APP_ANDROID_SKIP_UPDATE="False"

          export ACLOCAL_PATH="/usr/share/aclocal:/usr/local/share/aclocal"

          echo "=============================================="
          echo " INICIANDO COMPILACAO"
          echo "=============================================="

          echo
          echo "ACLOCAL_PATH:"
          echo "$ACLOCAL_PATH"

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Java:"
          java -version

          buildozer -v android debug \
            > >(tee build-apk.log) \
            2>&1

          BUILD_EXIT=$?

          echo
          echo "=============================================="
          echo " BUILDOZER EXIT CODE: $BUILD_EXIT"
          echo "=============================================="

          echo "$BUILD_EXIT" > build-exit-code.txt

          exit "$BUILD_EXIT"

      # ============================================================
      # 13 - DIAGNOSTICO
      # ============================================================

      - name: Diagnosticar erro
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " DIAGNOSTICO AUTOMATICO"
          echo "=============================================="

          if [ ! -f build-apk.log ]; then
            echo "build-apk.log nao encontrado."
            exit 0
          fi

          echo
          echo "=== ULTIMAS 600 LINHAS ==="

          tail -n 600 build-apk.log || true

          echo
          echo "=== ERROS IMPORTANTES ==="

          grep -niE \
            'error:|failed|failure|exception|traceback|command failed|no such file|not found|undefined reference|cannot|could not|license|aidl|gradle|clang|cython|autoconf|automake|libtool|ltdl|LT_SYS_SYMBOL_USCORE|sdkmanager|ndk|sdk|kivy|python3' \
            build-apk.log \
            | tail -n 400 \
            || true

      # ============================================================
      # 14 - MOSTRAR SDK NDK P4A
      # ============================================================

      - name: Mostrar SDK NDK e P4A
        if: always()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " SDK / NDK / P4A"
          echo "=============================================="

          find "$HOME/.buildozer/android/platform" \
            -maxdepth 3 \
            -type d \
            2>/dev/null \
            | sort \
            | tail -n 300 \
            || true

      # ============================================================
      # 15 - MOSTRAR RESULTADOS
      # ============================================================

      - name: Mostrar arquivos gerados
        if: always()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " ARQUIVOS GERADOS"
          echo "=============================================="

          find bin \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo
          echo "=== APK / AAB ==="

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print \
            2>/dev/null \
            || true

      # ============================================================
      # 16 - PREPARAR APK FINAL
      # ============================================================

      - name: Preparar APK final
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK encontrado."
            exit 1
          fi

          cp \
            "$APK" \
            artifact/Crypto-Certified-Switch-v7.1.0.apk

          sha256sum \
            artifact/Crypto-Certified-Switch-v7.1.0.apk \
            > artifact/SHA256.txt

          echo
          ls -lh artifact/Crypto-Certified-Switch-v7.1.0.apk

          echo
          cat artifact/SHA256.txt

      # ============================================================
      # 17 - SALVAR APK
      # ============================================================

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-APK
          path: |
            artifact/Crypto-Certified-Switch-v7.1.0.apk
            artifact/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 18 - SALVAR LOG SE FALHAR
      # ============================================================

      - name: Salvar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-Build-Log
          path: |
            build-apk.log
            build-exit-code.txt
            buildozer.spec
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 19 - CONCLUSAO
      # ============================================================

      - name: Build concluido
        if: success()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " APK GERADO COM SUCESSO"
          echo "=============================================="
          echo
          echo "Crypto-Certified-Switch-v7.1.0.apk"
