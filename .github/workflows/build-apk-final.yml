name: Gerar APK Android Final

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-certified-switch-android
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Crypto Certified Switch
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive

      # Overrides do bloco [app] do Buildozer
      APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
      APP_ANDROID_SKIP_UPDATE: "False"

    steps:

      # ============================================================
      # 01 - BAIXAR O PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 02 - VERIFICAR RUNNER
      # ============================================================

      - name: Verificar ambiente
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo " CRYPTO CERTIFIED SWITCH v7.1.0"
          echo " BUILD ANDROID - GITHUB ACTIONS"
          echo "=============================================="

          echo
          echo "Diretorio:"
          pwd

          echo
          echo "Sistema:"
          uname -a

          echo
          echo "Arquitetura:"
          uname -m

          echo
          echo "Arquivos da raiz:"
          ls -la

      # ============================================================
      # 03 - VALIDAR ESTRUTURA DO PROJETO
      # ============================================================

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -e

          if [ ! -f "main.py" ]; then
            echo "ERRO: main.py nao encontrado na raiz."
            exit 1
          fi

          if [ ! -f "buildozer.spec" ]; then
            echo "ERRO: buildozer.spec nao encontrado na raiz."
            exit 1
          fi

          echo "OK: main.py encontrado."
          echo "OK: buildozer.spec encontrado."

      # ============================================================
      # 04 - CONFIGURAR JAVA 17
      #
      # Usa o mecanismo oficial do GitHub Actions.
      # Nao dependemos do Java padrao do runner.
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 05 - INSTALAR DEPENDENCIAS UBUNTU
      #
      # IMPORTANTE:
      # Nao usar "| head" em comandos de versao.
      # Isso causava Broken pipe com pipefail.
      # ============================================================

      - name: Instalar dependencias Ubuntu
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " INSTALANDO DEPENDENCIAS DO SISTEMA"
          echo "=============================================="

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            patch \
            build-essential \
            ccache \
            ant

          echo
          echo "=============================================="
          echo " JAVA"
          echo "=============================================="

          java -version
          javac -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "=============================================="
          echo " PYTHON"
          echo "=============================================="

          python3 --version

          echo
          echo "=============================================="
          echo " GIT"
          echo "=============================================="

          git --version

          echo
          echo "=============================================="
          echo " AUTOCONF"
          echo "=============================================="

          autoconf --version

          echo
          echo "=============================================="
          echo " AUTOMAKE"
          echo "=============================================="

          automake --version

          echo
          echo "=============================================="
          echo " LIBTOOL"
          echo "=============================================="

          libtoolize --version

          echo
          echo "=============================================="
          echo " CMAKE"
          echo "=============================================="

          cmake --version

          echo
          echo "=============================================="
          echo " DEPENDENCIAS INSTALADAS COM SUCESSO"
          echo "=============================================="

      # ============================================================
      # 06 - CRIAR AMBIENTE VIRTUAL E INSTALAR BUILDOZER
      # ============================================================

      - name: Preparar Buildozer
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " PREPARANDO AMBIENTE PYTHON"
          echo "=============================================="

          rm -rf .venv

          python3 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.34"

          echo
          echo "=============================================="
          echo " FERRAMENTAS PYTHON"
          echo "=============================================="

          python --version
          buildozer --version
          cython --version

      # ============================================================
      # 07 - VALIDAR TODO O PYTHON DO PROJETO
      # ============================================================

      - name: Validar sintaxe Python
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          IGNORAR = {
              ".git",
              ".github",
              ".buildozer",
              ".venv",
              "venv",
              "bin",
              "artifact",
              "__pycache__",
          }

          erros = []

          for arquivo in Path(".").rglob("*.py"):

              if any(parte in IGNORAR for parte in arquivo.parts):
                  continue

              try:
                  py_compile.compile(
                      str(arquivo),
                      doraise=True,
                  )

                  print("OK:", arquivo)

              except Exception as exc:
                  erros.append(
                      (
                          arquivo,
                          exc,
                      )
                  )

          if erros:

              print()
              print("==============================================")
              print(" ERROS PYTHON ENCONTRADOS")
              print("==============================================")

              for arquivo, erro in erros:

                  print()
                  print("Arquivo:", arquivo)
                  print("Erro:", erro)

              sys.exit(1)

          print()
          print("==============================================")
          print(" SINTAXE PYTHON VALIDADA")
          print("==============================================")
          PY

      # ============================================================
      # 08 - PREPARAR BUILDOZER.SPEC PARA O CI
      #
      # As configuracoes sao alteradas dentro da secao [app].
      # ============================================================

      - name: Preparar buildozer.spec
        shell: bash
        run: |
          set -euo pipefail

          cp buildozer.spec buildozer-original.spec

          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")

          texto = p.read_text(
              encoding="utf-8-sig"
          )

          linhas = texto.splitlines()

          resultado = []

          dentro_app = False

          encontrou_accept = False
          encontrou_skip = False

          for linha in linhas:

              limpa = linha.strip()

              if limpa.startswith("[") and limpa.endswith("]"):

                  if dentro_app:

                      if not encontrou_accept:

                          resultado.append(
                              "android.accept_sdk_license = True"
                          )

                      if not encontrou_skip:

                          resultado.append(
                              "android.skip_update = False"
                          )

                  dentro_app = (
                      limpa.lower() == "[app]"
                  )

                  resultado.append(linha)

                  continue

              if dentro_app:

                  chave = (
                      limpa
                      .lstrip("#")
                      .strip()
                  )

                  if chave.startswith(
                      "android.accept_sdk_license"
                  ):

                      resultado.append(
                          "android.accept_sdk_license = True"
                      )

                      encontrou_accept = True

                      continue

                  if chave.startswith(
                      "android.skip_update"
                  ):

                      resultado.append(
                          "android.skip_update = False"
                      )

                      encontrou_skip = True

                      continue

              resultado.append(linha)

          if dentro_app:

              if not encontrou_accept:

                  resultado.append(
                      "android.accept_sdk_license = True"
                  )

              if not encontrou_skip:

                  resultado.append(
                      "android.skip_update = False"
                  )

          p.write_text(
              "\n".join(resultado) + "\n",
              encoding="utf-8",
          )

          print(
              "OK: buildozer.spec preparado para GitHub Actions."
          )
          PY

          echo
          echo "=============================================="
          echo " CONFIGURACAO ANDROID EFETIVA"
          echo "=============================================="

          grep -nE \
            '^\[app\]|android\.api|android\.minapi|android\.ndk|android\.accept_sdk_license|android\.skip_update|requirements|p4a\.' \
            buildozer.spec \
            || true

      # ============================================================
      # 09 - VALIDAR CONFIGURACAO ANDROID
      # ============================================================

      - name: Validar configuracao Android
        shell: bash
        run: |
          set -euo pipefail

          echo "APP_ANDROID_ACCEPT_SDK_LICENSE=$APP_ANDROID_ACCEPT_SDK_LICENSE"
          echo "APP_ANDROID_SKIP_UPDATE=$APP_ANDROID_SKIP_UPDATE"

          if ! grep -q \
            '^android.accept_sdk_license = True' \
            buildozer.spec
          then

            echo
            echo "ERRO:"
            echo "android.accept_sdk_license nao esta ativo."

            exit 1
          fi

          if ! grep -q \
            '^android.skip_update = False' \
            buildozer.spec
          then

            echo
            echo "ERRO:"
            echo "android.skip_update nao esta configurado."

            exit 1
          fi

          echo
          echo "OK: configuracao Android validada."

      # ============================================================
      # 10 - LIMPAR AMBIENTE DE COMPILACAO
      # ============================================================

      - name: Limpar ambiente de compilacao
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " LIMPANDO BUILD ANTERIOR"
          echo "=============================================="

          rm -rf .buildozer
          rm -rf bin
          rm -rf artifact

          mkdir -p bin
          mkdir -p artifact

          echo "OK: ambiente limpo."

      # ============================================================
      # 11 - CONFIRMAR JAVA UTILIZADO
      # ============================================================

      - name: Configurar Java 17 para compilacao
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " JAVA UTILIZADO PELO BUILDOZER"
          echo "=============================================="

          echo "JAVA_HOME=$JAVA_HOME"

          command -v java
          command -v javac
          command -v keytool

          java -version
          javac -version

      # ============================================================
      # 12 - COMPILAR APK
      #
      # Sem "yes | buildozer".
      # Preserva o retorno real do Buildozer.
      # ============================================================

      - name: Compilar APK
        id: build_apk
        shell: bash
        run: |
          set +e

          source .venv/bin/activate

          export APP_ANDROID_ACCEPT_SDK_LICENSE="True"
          export APP_ANDROID_SKIP_UPDATE="False"

          echo "=============================================="
          echo " INICIANDO COMPILACAO ANDROID"
          echo "=============================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Java:"
          java -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "=============================================="
          echo " EXECUTANDO BUILDOZER"
          echo "=============================================="

          buildozer -v android debug \
            > >(tee build-apk.log) \
            2>&1

          BUILD_EXIT=$?

          echo
          echo "=============================================="
          echo " BUILDOZER EXIT CODE: $BUILD_EXIT"
          echo "=============================================="

          echo "$BUILD_EXIT" \
            > build-exit-code.txt

          exit "$BUILD_EXIT"

      # ============================================================
      # 13 - DIAGNOSTICO AUTOMATICO
      # ============================================================

      - name: Diagnosticar erro
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " DIAGNOSTICO AUTOMATICO"
          echo "=============================================="

          if [ ! -f build-apk.log ]; then

            echo
            echo "Log build-apk.log nao encontrado."
            echo
            echo "A falha ocorreu antes da compilacao."

            exit 0
          fi

          echo
          echo "=== ULTIMAS 300 LINHAS ==="

          tail -n 300 \
            build-apk.log \
            || true

          echo
          echo "=== ERROS IMPORTANTES ==="

          grep -niE \
            'error:|failed|failure|exception|traceback|command failed|no such file|not found|undefined reference|cannot|could not|license|aidl|gradle|clang|cython|autoconf|automake|libtool|sdkmanager|ndk|sdk' \
            build-apk.log \
            | tail -n 200 \
            || true

      # ============================================================
      # 14 - MOSTRAR SDK E NDK
      # ============================================================

      - name: Mostrar SDK e NDK
        if: always()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " SDK / NDK ENCONTRADOS"
          echo "=============================================="

          echo
          echo "=== BUILDOZER ANDROID ==="

          find "$HOME/.buildozer/android" \
            -maxdepth 4 \
            -type d \
            2>/dev/null \
            | sort \
            | tail -n 200 \
            || true

          echo
          echo "=== ANDROID SDK ==="

          find "$HOME/.buildozer/android/platform/android-sdk" \
            -maxdepth 3 \
            -type d \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "=== ANDROID NDK ==="

          find "$HOME/.buildozer/android/platform" \
            -maxdepth 2 \
            -type d \
            -name '*ndk*' \
            -print \
            2>/dev/null \
            || true

      # ============================================================
      # 15 - LOCALIZAR RESULTADOS
      # ============================================================

      - name: Mostrar arquivos gerados
        if: always()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo " ARQUIVOS GERADOS"
          echo "=============================================="

          echo
          echo "=== BIN ==="

          find bin \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo
          echo "=== TODOS APK / AAB ==="

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print \
            2>/dev/null \
            || true

      # ============================================================
      # 16 - PREPARAR APK FINAL
      # ============================================================

      - name: Preparar APK final
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then

            echo
            echo "ERRO:"
            echo "Nenhum APK encontrado em bin/."

            exit 1
          fi

          echo
          echo "APK encontrado:"
          echo "$APK"

          cp \
            "$APK" \
            artifact/Crypto-Certified-Switch-v7.1.0.apk

          sha256sum \
            artifact/Crypto-Certified-Switch-v7.1.0.apk \
            > artifact/SHA256.txt

          echo
          echo "=============================================="
          echo " APK FINAL"
          echo "=============================================="

          ls -lh \
            artifact/Crypto-Certified-Switch-v7.1.0.apk

          echo
          cat artifact/SHA256.txt

      # ============================================================
      # 17 - SALVAR APK COMO ARTIFACT
      # ============================================================

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-APK
          path: |
            artifact/Crypto-Certified-Switch-v7.1.0.apk
            artifact/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 18 - SALVAR LOG COMPLETO EM CASO DE FALHA
      # ============================================================

      - name: Salvar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-Build-Log
          path: |
            build-apk.log
            build-exit-code.txt
            buildozer.spec
            buildozer-original.spec
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 19 - CONCLUSAO
      # ============================================================

      - name: Build concluido
        if: success()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " APK GERADO COM SUCESSO"
          echo "=============================================="
          echo
          echo "Arquivo:"
          echo "Crypto-Certified-Switch-v7.1.0.apk"
