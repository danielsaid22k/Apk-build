name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar projeto
        run: |
          echo "========================================"
          echo " CRYPTO CERTIFIED SWITCH - APK BUILD"
          echo "========================================"

          pwd
          ls -la

          test -f main.py || {
            echo "ERRO: main.py nao encontrado"
            exit 1
          }

          test -f buildozer.spec || {
            echo "ERRO: buildozer.spec nao encontrado"
            exit 1
          }

          test -f android_config.py || {
            echo "ERRO: android_config.py nao encontrado"
            exit 1
          }

          echo "Estrutura principal OK."

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            build-essential \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            gettext \
            patch \
            wget \
            curl

          java -version
          python3 --version

      - name: Preparar Python do build
        run: |
          python3 -m pip install --upgrade \
            "pip<26" \
            setuptools \
            wheel \
            virtualenv

          python3 -m pip --version

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --upgrade \
            buildozer \
            cython

          buildozer --version
          cython --version

      - name: Aceitar licencas Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null || true

      - name: Instalar Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.1.0"

          echo "Build tools instalados:"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Verificar AIDL
        run: |
          echo "Procurando AIDL..."

          find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aidl \
            -print

          AIDL="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aidl \
            -perm -111 \
            | sort -V \
            | tail -1)"

          if [ -z "$AIDL" ]; then
            echo "ERRO: AIDL nao encontrado"
            exit 1
          fi

          echo "AIDL encontrado:"
          echo "$AIDL"

          "$AIDL" --help >/dev/null

      - name: Limpar build anterior
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Compilar APK
        run: |
          set -o pipefail

          echo "Iniciando compilacao limpa..."
          buildozer -v android debug 2>&1 | tee build.log

      - name: Localizar APK
        if: success()
        run: |
          echo "Procurando APK..."

          find . \
            -type f \
            -iname "*.apk" \
            -print

          APK="$(find . \
            -type f \
            -iname "*.apk" \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERRO: compilacao terminou mas nenhum APK foi encontrado"
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" \
            "Crypto_Certified_Switch_v7_1_0.apk"

          ls -lh \
            "Crypto_Certified_Switch_v7_1_0.apk"

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-APK
          path: Crypto_Certified_Switch_v7_1_0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Salvar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CCS-build-error-log
          path: |
            build.log
            .buildozer/android/platform/**/config.log
          if-no-files-found: ignore
          retention-days: 7
