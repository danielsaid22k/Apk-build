name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/kivy/buildozer:latest

    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar ambiente
        shell: bash
        run: |
          echo "======================================"
          echo " CRYPTO CERTIFIED SWITCH - ANDROID"
          echo "======================================"

          pwd
          python3 --version
          buildozer --version
          java -version || true

          echo ""
          echo "Arquivos do projeto:"
          ls -la

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          test -f main.py || {
            echo "ERRO: main.py nao encontrado"
            exit 1
          }

          test -f buildozer.spec || {
            echo "ERRO: buildozer.spec nao encontrado"
            exit 1
          }

          echo "Estrutura OK."

      - name: Validar sintaxe Python
        shell: bash
        run: |
          python3 -m py_compile main.py

          if [ -f android_config.py ]; then
            python3 -m py_compile android_config.py
          fi

          if [ -d app ]; then
            find app -type f -name "*.py" -print0 \
              | xargs -0 -r -n1 python3 -m py_compile
          fi

          if [ -d ccs ]; then
            find ccs -type f -name "*.py" -print0 \
              | xargs -0 -r -n1 python3 -m py_compile
          fi

          echo "Sintaxe Python OK."

      - name: Ajustar buildozer.spec
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")

          text = p.read_text(
              encoding="utf-8",
              errors="replace",
          )

          desired = {
              "requirements": "python3,kivy",
              "android.api": "35",
              "android.minapi": "26",
              "android.archs": "arm64-v8a",
              "android.accept_sdk_license": "True",
          }

          lines = text.splitlines()
          output = []
          found = set()

          for line in lines:
              normalized = line.strip().lstrip("#").strip()
              replaced = False

              for key, value in desired.items():
                  if normalized.startswith(key + " ="):
                      output.append(f"{key} = {value}")
                      found.add(key)
                      replaced = True
                      break

              if not replaced:
                  output.append(line)

          for key, value in desired.items():
              if key not in found:
                  output.append(f"{key} = {value}")

          p.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8",
          )
          PY

          grep -nE \
            "requirements|android.api|android.minapi|android.archs|android.accept_sdk_license" \
            buildozer.spec

      - name: Limpar build antigo
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf release

          mkdir -p release

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail

          buildozer -v android debug \
            2>&1 | tee build.log

      - name: Localizar APK
        shell: bash
        run: |
          find . \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find . -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK encontrado."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Preparar APK final
        shell: bash
        run: |
          cp \
            "$APK" \
            release/Crypto_Certified_Switch_v7_1_0.apk

          ls -lh release/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-APK
          path: release/Crypto_Certified_Switch_v7_1_0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Salvar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
