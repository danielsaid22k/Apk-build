name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          echo "========================================"
          echo " CRYPTO CERTIFIED SWITCH - APK BUILD"
          echo "========================================"

          echo ""
          echo "Diretorio atual:"
          pwd

          echo ""
          echo "Arquivos principais:"
          ls -la

          echo ""
          echo "Verificando arquivos obrigatorios..."

          test -f main.py || {
            echo "ERRO: main.py nao encontrado"
            exit 1
          }

          test -f buildozer.spec || {
            echo "ERRO: buildozer.spec nao encontrado"
            exit 1
          }

          test -f android_config.py || {
            echo "ERRO: android_config.py nao encontrado"
            exit 1
          }

          echo ""
          echo "Estrutura principal OK."

      - name: Validar sintaxe Python
        shell: bash
        run: |
          echo "Compilando sintaxe Python..."

          python3 -m py_compile main.py
          python3 -m py_compile android_config.py

          if [ -d "app" ]; then
            find app -type f -name "*.py" -print0 | xargs -0 -r -n1 python3 -m py_compile
          fi

          if [ -d "ccs" ]; then
            find ccs -type f -name "*.py" -print0 | xargs -0 -r -n1 python3 -m py_compile
          fi

          echo ""
          echo "Sintaxe Python OK."

      - name: Preparar buildozer.spec
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          text = path.read_text(
              encoding="utf-8",
              errors="replace",
          )

          replacements = {
              "requirements": "python3,kivy",
              "android.api": "35",
              "android.minapi": "26",
              "android.archs": "arm64-v8a",
              "android.accept_sdk_license": "True",
              "android.skip_update": "False",
          }

          lines = text.splitlines()
          output = []
          found = set()

          for line in lines:
              stripped = line.strip()

              replaced = False

              for key, value in replacements.items():
                  prefixes = (
                      f"{key} =",
                      f"#{key} =",
                      f"# {key} =",
                  )

                  if any(stripped.startswith(p) for p in prefixes):
                      output.append(
                          f"{key} = {value}"
                      )
                      found.add(key)
                      replaced = True
                      break

              if not replaced:
                  output.append(line)

          for key, value in replacements.items():
              if key not in found:
                  output.append(
                      f"{key} = {value}"
                  )

          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8",
          )

          print("buildozer.spec atualizado.")
          PY

          echo ""
          echo "Configuracao final:"
          grep -nE \
            "requirements|android.api|android.minapi|android.archs|android.accept_sdk_license|android.skip_update" \
            buildozer.spec

      - name: Limpar arquivos antigos de compilacao
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Ambiente local de build limpo."

      - name: Compilar APK
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer -v android debug
          buildozer_version: stable
          workdir: .

      - name: Localizar APK
        shell: bash
        run: |
          echo ""
          echo "Procurando APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT="$(find . -type f -name '*.apk' | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERRO: nenhum APK encontrado."
            exit 1
          fi

          echo ""
          echo "APK encontrado."

      - name: Preparar APK final
        shell: bash
        run: |
          mkdir -p release

          APK="$(find . -type f -name '*.apk' | head -n 1)"

          echo "APK original:"
          echo "$APK"

          cp \
            "$APK" \
            "release/Crypto_Certified_Switch_v7_1_0.apk"

          echo ""
          echo "APK final:"
          ls -lh release/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-v7.1.0-APK
          path: release/Crypto_Certified_Switch_v7_1_0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build concluido
        shell: bash
        run: |
          echo "========================================"
          echo " APK GERADO COM SUCESSO"
          echo "========================================"
          echo ""
          echo "Arquivo:"
          echo "Crypto_Certified_Switch_v7_1_0.apk"
