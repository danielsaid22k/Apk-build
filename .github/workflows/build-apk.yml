name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            ccache \
            build-essential

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "Verificando AIDL:"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aidl"
          "$ANDROID_HOME/build-tools/37.0.0/aidl" --help >/dev/null || true

      - name: Configurar Buildozer corretamente
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text()

          linhas_remover = (
              "android.sdk_path",
              "android.skip_update",
              "android.accept_sdk_license",
          )

          linhas = []

          for linha in text.splitlines():
              stripped = linha.strip().lstrip("#").strip()

              if any(stripped.startswith(x + " =") for x in linhas_remover):
                  continue

              linhas.append(linha)

          resultado = []
          inserido = False

          for linha in linhas:
              resultado.append(linha)

              if linha.strip() == "[app]" and not inserido:
                  resultado.extend([
                      "",
                      "android.sdk_path = " + __import__("os").environ["ANDROID_HOME"],
                      "android.skip_update = True",
                      "android.accept_sdk_license = True",
                      "",
                  ])
                  inserido = True

          if not inserido:
              raise SystemExit("ERRO: secao [app] nao encontrada no buildozer.spec")

          p.write_text("\n".join(resultado) + "\n")
          PY

          echo "Configuracao Android aplicada:"
          grep -nE "android.sdk_path|android.skip_update|android.accept_sdk_license" buildozer.spec

      - name: Verificar SDK usado
        run: |
          echo "SDK do GitHub:"
          echo "$ANDROID_HOME"

          echo "AIDL:"
          ls -lh "$ANDROID_HOME/build-tools/37.0.0/aidl"

          echo "Configuracao no buildozer.spec:"
          grep -nE "android.sdk_path|android.skip_update|android.accept_sdk_license" buildozer.spec

      - name: Compilar APK
        env:
          ANDROIDSDK: ${{ env.ANDROID_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          buildozer -v android debug

      - name: Localizar APK
        run: |
          echo "APKs encontrados:"
          find . -type f -name "*.apk" -print

          APK_FILE="$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          echo "APK encontrado: $APK_FILE"

      - name: Preparar APK para download
        run: |
          mkdir -p release

          APK_FILE="$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)"

          cp "$APK_FILE" \
            release/Crypto_Certified_Switch_v7_1_0_debug.apk

          ls -lh release/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Certified-Switch-APK
          path: release/Crypto_Certified_Switch_v7_1_0_debug.apk
          if-no-files-found: error
          retention-days: 30
